[project]
name = "psm-incident-ml"
version = "0.1.0"
description = "Reproducible dataset and baselines for process-safety incident investigation ML, from US federal offshore (BSEE) incident reports."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pdfplumber>=0.11",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "tqdm>=4.66",
    # psm.e19_schema only. Reads the E19 workbook (not committed - see CLAUDE.md)
    # to regenerate schema/e19_labels.yaml. The rest of the pipeline runs
    # without it, since that YAML is committed.
    "openpyxl>=3.1",
    # psm.llm_label --backend bedrock (the default). Imported lazily so
    # --dry-run and --backend anthropic don't require it.
    "boto3>=1.34",
]

[project.optional-dependencies]
# psm.baseline only (the reproducible cause-classification baseline).
ml = [
    "numpy",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psm"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
